<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>food.st44.no — coming soon</title>
    <meta name="description" content="The ST44 food site is on its way." />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf7f0;
        --fg: #2b2118;
        --muted: #6f6256;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191411;
          --fg: #f3ece3;
          --muted: #a4968a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .mark {
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" role="img" aria-label="Cooking pot">🍲</div>
      <h1>food.st44.no</h1>
      <p>The site is coming. Nothing to eat here yet.</p>
    </main>
  </body>
</html>
