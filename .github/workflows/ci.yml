name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the build job adds packages:write for GHCR.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Cheap checks first, so an obvious mistake fails in seconds.
  validate:
    name: Validate sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Required files exist
        run: |
          for f in site/index.html nginx.conf Dockerfile README.md DEPLOY.md LICENSE; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done

      # The deploy workflow scps this file to the server and runs compose there,
      # so a typo would otherwise only surface mid-deploy.
      - name: Deploy compose file is valid
        run: |
          set -euo pipefail
          docker compose -p food-st44 -f infra/docker-compose.yml config > compose.normalised.yml

          # No published host ports: nginx-proxy reaches the container over the
          # shared st44_default network, and publishing one would bypass TLS.
          if docker compose -p food-st44 -f infra/docker-compose.yml config --format json \
            | grep -q '"published"'; then
            echo '::error::infra/docker-compose.yml must not publish host ports'
            exit 1
          fi

          # Keys that would give the container more of the host than a static
          # site needs. Nothing on spzmf refuses them for us — the deploy runs
          # plain `docker compose up` as the deploy user — so this grep is the
          # only gate, and it has to hold. Run against the normalised output, so
          # flow style cannot slip a key past it.
          if grep -nE '^[[:space:]]*(privileged|cap_add|cap_drop|devices|device|device_cgroup_rules|pid|ipc|uts|userns_mode|network_mode|security_opt|sysctls|cgroup|cgroup_parent|build|extends|volumes_from)[[:space:]]*:' compose.normalised.yml; then
            echo '::error::infra/docker-compose.yml uses a key this site must not need'
            exit 1
          fi

          # container_name is global to the docker daemon, so it is the one name
          # that could collide with another site on spzmf.
          awk '/^[[:space:]]*container_name:[[:space:]]*/ { sub(/^[[:space:]]*container_name:[[:space:]]*/, ""); gsub(/"/, ""); print }' \
            compose.normalised.yml \
          | while read -r name; do
              case "$name" in
                food-st44|food-st44-*|food-st44_*) ;;
                *) echo "::error::container_name '$name' must be food-st44 or food-st44-*"; exit 1 ;;
              esac
            done

      - name: index.html looks like a page
        run: |
          grep -qi '<!doctype html>' site/index.html || { echo '::error::no doctype'; exit 1; }
          grep -qi '<title>' site/index.html || { echo '::error::no <title>'; exit 1; }

      - name: No committed env files
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::a .env file is committed"
            exit 1
          fi

  build:
    name: Build image
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build once into the local daemon. On main we push these exact tags,
      # so the tested image and the shipped image are the same build.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          TAG="$(head -n1 <<<'${{ steps.meta.outputs.tags }}')"
          echo "testing $TAG"
          docker run --rm "$TAG" nginx -t
          docker run -d --name smoke -p 8080:80 "$TAG"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then docker logs smoke; echo '::error::container never became healthy'; exit 1; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          curl -fsS http://127.0.0.1:8080/ | grep -q 'food.st44.no'
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<<'${{ steps.meta.outputs.tags }}'

      # Fallback delivery path: GHCR needs a token with read:packages, which not
      # every consumer has. The tarball is downloadable with plain repo access.
      - name: Save image as a tarball
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save "${IMAGE}:${GITHUB_SHA}" | gzip > "food-st44-${GITHUB_SHA}.tar.gz"
          ls -lh "food-st44-${GITHUB_SHA}.tar.gz"

      - name: Upload image tarball
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ github.sha }}
          path: food-st44-${{ github.sha }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            if [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref }}' = 'refs/heads/main' ]; then
              echo "Pushed to GHCR."
            else
              echo "Built and smoke-tested only (not pushed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
