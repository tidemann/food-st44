name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only throughout. CI validates, builds and smoke-tests; it publishes
# nothing, so no job here needs packages:write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Cheap checks first, so an obvious mistake fails in seconds.
  validate:
    name: Validate sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Required files exist
        run: |
          for f in package.json package-lock.json src/server.js src/db.js \
                   views/list.ejs Dockerfile README.md DEPLOY.md LICENSE; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done

      # The deploy workflow scps this file to the server and runs compose there,
      # so a typo would otherwise only surface mid-deploy.
      - name: Deploy compose file is valid
        env:
          # The real value comes from the .env the deploy workflow writes on the
          # server. A stand-in here lets `config` resolve the file so the checks
          # below see the whole thing; the `${IMAGE:?}` guard still fails the
          # deploy if the workflow ever stops supplying it.
          IMAGE: ghcr.io/tidemann/food-st44:validate-only
        run: |
          set -euo pipefail
          docker compose -p food-st44 -f infra/docker-compose.yml config > compose.normalised.yml

          # No published host ports: nginx-proxy reaches the container over the
          # shared st44_default network, and publishing one would bypass TLS.
          if docker compose -p food-st44 -f infra/docker-compose.yml config --format json \
            | grep -q '"published"'; then
            echo '::error::infra/docker-compose.yml must not publish host ports'
            exit 1
          fi

          # Keys that would give the container more of the host than a static
          # site needs. Nothing on spzmf refuses them for us — the deploy runs
          # plain `docker compose up` as the deploy user — so this grep is the
          # only gate, and it has to hold. Run against the normalised output, so
          # flow style cannot slip a key past it.
          if grep -nE '^[[:space:]]*(privileged|cap_add|cap_drop|devices|device|device_cgroup_rules|pid|ipc|uts|userns_mode|network_mode|security_opt|sysctls|cgroup|cgroup_parent|build|extends|volumes_from)[[:space:]]*:' compose.normalised.yml; then
            echo '::error::infra/docker-compose.yml uses a key this site must not need'
            exit 1
          fi

          # container_name is global to the docker daemon, so it is the one name
          # that could collide with another site on spzmf.
          awk '/^[[:space:]]*container_name:[[:space:]]*/ { sub(/^[[:space:]]*container_name:[[:space:]]*/, ""); gsub(/"/, ""); print }' \
            compose.normalised.yml \
          | while read -r name; do
              case "$name" in
                food-st44|food-st44-*|food-st44_*) ;;
                *) echo "::error::container_name '$name' must be food-st44 or food-st44-*"; exit 1 ;;
              esac
            done

      # Every page opens with the shared head partial, so that is where the
      # doctype and the title live. Each page template must pull it in.
      - name: Pages look like pages
        run: |
          grep -qi '<!doctype html>' views/partials/head.ejs || { echo '::error::no doctype'; exit 1; }
          grep -qi '<title>' views/partials/head.ejs || { echo '::error::no <title>'; exit 1; }
          for page in views/*.ejs; do
            [ "$page" = "views/_form.ejs" ] && continue
            grep -q "include('partials/head'" "$page" || { echo "::error::$page does not include the head partial"; exit 1; }
          done

      - name: No committed env files
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::a .env file is committed"
            exit 1
          fi

      # The unit tests are the cheapest thing that actually exercises the app,
      # so they run here rather than waiting on the image build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: Build image
    needs: validate
    runs-on: ubuntu-24.04
    # Read-only: this job builds and smoke-tests, it never publishes. Pushing
    # to GHCR belongs to the deploy workflow, which is the single publisher.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=

      # Built into the local daemon and smoke-tested, never pushed. The deploy
      # workflow builds and pushes the tag that actually ships, from this same
      # commit and Dockerfile; the gha cache is shared, so this is cheap.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image that ships is v2 (./Dockerfile builds v2/). Run it through
      # the deploy compose file against a v1 volume as the live site leaves it,
      # so the one-time recipe import, the ids, /healthz = ok and an unchanged
      # v1 file are all proven here and not first on spzmf.
      - name: Smoke test the deploy (compose, v1 import)
        run: |
          set -euo pipefail
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq sqlite3; }
          infra/smoke-deploy.sh "$(head -n1 <<<'${{ steps.meta.outputs.tags }}')"

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo "Built and smoke-tested only. The deploy workflow builds and"
            echo "pushes the tag that ships."
          } >> "$GITHUB_STEP_SUMMARY"
