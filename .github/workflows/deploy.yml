name: Deploy

# The deploy route lives once, in tidemann/deploy-workflows, and is called from
# here. Pinned to the v1 tag, not main: moving v1 there is a deliberate act that
# changes every site at once.
#
# What it does is unchanged from the 155-line copy this replaced — build and
# push the image to GHCR tagged by commit SHA, ssh to the server with
# StrictHostKeyChecking yes, record the running image as the rollback anchor,
# ship the compose file, pull and recreate, then gate on healthz twice: once by
# service name on the proxy network, once on the public URL over valid TLS.
# See DEPLOY.md, and the deploy-workflows README for the inputs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A push that touches only these paths leaves the live site alone: v2 has
    # its own workflow, and docs do not change the running app. Anything else
    # (src/, views/, public/, Dockerfile, infra/ ...) still deploys.
    paths-ignore:
      - 'v2/**'
      - '.github/workflows/v2.yml'
      - 'docs/**'
      - '**/*.md'

# A called workflow cannot grant itself more than its caller holds, so
# packages:write has to be here for the build job to push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: tidemann/deploy-workflows/.github/workflows/build-and-deploy.yml@v1
    with:
      app-name: food-st44
      site-host: food.st44.no
      # food-st44's key is re-minted with the forced command
      # (restrict,command="/srv/apps/food-st44/deploy.sh"), so every deploy now
      # proves the key cannot run anything else. st44-home's compose read is the
      # cross-site case a leaked key must not reach.
      verify-forced-command: true
      verify-other-site-path: /srv/st44-home/infra/docker-compose.yml
    # DEPLOY_KEY, SERVER_HOST and SERVER_USER — the three that
    # `agent-deploy-key` sets on this repository.
    secrets: inherit
