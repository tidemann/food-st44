name: Deploy

# Private deploy route. CI sends infra/docker-compose.yml to spzmf on stdin and
# the host's own deploy script does the rest. The GHCR package stays private —
# the registry credential lives on the host, in the deploy user's docker config,
# and never travels through this workflow.
#
# One ssh call, on purpose. This repo's deploy key is installed with an SSH
# forced command (`restrict,command="/srv/apps/food-st44/deploy.sh"`), so it can
# run that one script and nothing else: no `scp`, no `docker`, no shell, and no
# reaching into another site's directory. A leaked DEPLOY_KEY can therefore
# redeploy food-st44 and do nothing more.
#
# The command is still named in the ssh line even though the forced command
# overrides it. That is deliberate: the same workflow works whether or not the
# key has been tightened yet, so the workflow and the key can be switched in
# either order without a broken deploy in between.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-food-st44
  cancel-in-progress: false

env:
  # The forced command on this repo's deploy key. Created, together with
  # /srv/apps/food-st44/infra, by `agent-docker mkapp food-st44 --deploy` on the
  # host. It receives the compose file on stdin, installs it, pulls, recreates,
  # and fails the job if the container does not answer its health check.
  REMOTE_SCRIPT: /srv/apps/food-st44/deploy.sh
  SITE_HOST: food.st44.no

jobs:
  deploy:
    name: Deploy to spzmf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # One ssh alias, so the host and user are named once and no step has to
      # re-interpolate a secret into a command line.
      - name: Configure ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # StrictHostKeyChecking=yes, so a swapped host key fails the deploy
          # rather than silently trusting a new one.
          ssh-keyscan -H '${{ secrets.SERVER_HOST }}' >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host spzmf
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      # Everything the host needs is in the compose file, so this is the whole
      # deploy: ship it, and let the host's script install it, pull, recreate and
      # check that the container answers. Its output is kept for the summary —
      # it prints the image it replaced, which is the rollback anchor.
      - name: Deploy
        run: |
          set -euo pipefail
          if ! ssh spzmf "${REMOTE_SCRIPT}" < infra/docker-compose.yml | tee deploy.log; then
            echo "::error::the deploy script on spzmf failed — see the log above"
            exit 1
          fi

      # Only true once nginx-proxy has a vhost and a valid certificate for the
      # hostname. A healthy container is not a finished deploy; this is the one
      # check CI can still make on its own, because it needs no host access.
      - name: Verify https://food.st44.no/healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            # curl already reports 000 for a connection or TLS failure; `|| true`
            # only stops `set -e` from aborting the retry loop.
            code="$(curl -sS -o body.txt -w '%{http_code}' "https://${SITE_HOST}/healthz" || true)"
            if [ "$code" = "200" ] && [ "$(tr -d '[:space:]' < body.txt)" = "ok" ]; then
              echo "public healthz: 200 ok over valid TLS"
              exit 0
            fi
            echo "attempt $i: http=$code"
            sleep 10
          done
          echo "::error::https://${SITE_HOST}/healthz did not return 200 ok with valid TLS"
          curl -sSv "https://${SITE_HOST}/healthz" || true
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### food-st44 deploy"
            echo
            echo "- Image: \`$(grep -m1 -oE 'image: *\S+' infra/docker-compose.yml | awk '{print $2}')\`"
            echo "- Remote command: \`${REMOTE_SCRIPT}\` (SSH forced command)"
            echo "- Public health check: https://${SITE_HOST}/healthz"
            echo "- Previous image (rollback anchor):"
            echo '```'
            grep '^previous-image:' deploy.log 2>/dev/null || echo 'previous-image: unknown (the deploy did not get that far)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
