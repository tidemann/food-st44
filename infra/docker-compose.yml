# Deploy unit for food.st44.no.
#
# The GHCR package is private and stays private. The pull happens here, on
# spzmf, as the deploy user whose docker config already holds the registry
# credential. CI never ships the image bytes and never hands a credential to
# the server; it only runs these commands over SSH.
#
# The image is supplied by the deploy workflow, which renders ${IMAGE} below
# into this file before sending it to the server. It is always a commit-SHA
# tag, never `latest`: `latest` is a pointer, not a release identity. For
# rolling back, see DEPLOY.md.
#
# Pinned explicitly. Compose otherwise names the project after its directory,
# which is `infra` here — and st44-home also deploys from a directory called
# `infra`, so both stacks would claim the same project name on this host and
# could tear each other's containers down.
name: food-st44

services:
  food-st44:
    image: ${IMAGE:?IMAGE must be set — the deploy workflow renders it}
    container_name: food-st44
    restart: unless-stopped
    # Deliberately no `ports:`. nginx-proxy terminates TLS and reaches this
    # container at http://food-st44:80 over the shared network below.
    environment:
      # nginx-proxy sends food.st44.no; food-st44 and 127.0.0.1 are the
      # health checks by service name and inside the container.
      DJANGO_ALLOWED_HOSTS: food.st44.no,food-st44,localhost,127.0.0.1
      DJANGO_DB_PATH: /data/food.sqlite3
      # Created on first start on the data volume (docker-entrypoint.sh), so
      # no secret is provisioned on the host or passed through CI.
      DJANGO_SECRET_KEY_FILE: /data/secret_key
      # The v1 recipes, copied into the v2 database once, same ids. The
      # entrypoint writes /data/v1-imported and never imports again.
      V1_DB_PATH: /v1/recipes.db
      # v1's recipe photos (in the image), put on their recipes once, into
      # /data/photos next to the database. Marker: /data/v1-photos-imported.
      V1_PHOTOS_DIR: /app/v1-photos
    # Google sign-in (M2): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and
    # FOOD_ADMIN_EMAILS, one KEY=value per line, in a file the owner puts on the
    # server by hand (mode 600, owned by the deploy user). It is not in git and
    # not in CI, and every deploy leaves it alone: deploy.sh only replaces the
    # compose file. Optional, so a deploy before it exists still starts — the
    # site is then read-only, with no "Logg inn" (needs Compose 2.24+).
    env_file:
      - path: /srv/apps/food-st44/google-oauth.env
        required: false
    volumes:
      # The v2 SQLite database (DJANGO_DB_PATH) and its secret key. Compose
      # creates the volume on first `up`; nothing needs provisioning on the host.
      - food-st44-v2-data:/data
      # The v1 site's volume, read-only: v2 can read recipes.db but cannot
      # change or delete it, so a rollback to v1 finds it exactly as it was.
      # Mounting it also keeps it in use, so a volume prune cannot remove it.
      - food-st44-data:/v1:ro
    networks:
      - st44_default

  # Nightly backup of the data volume: database (SQLite online backup, not a file copy), photos
  # and import markers, as food-YYYY-MM-DD.tar.gz, newest 14 kept. Same image, its own process;
  # it checks every hour and makes the day's archive in the first hour after 00:00 UTC. It
  # writes only to a directory holding `.food-backup-target`; on spzmf backups/ leads to the
  # NAS, so with the NAS away it writes nothing and says so in its log. Restore: DEPLOY.md.
  # No networks: it talks to nobody (compose gives it the project's default network).
  food-st44-backup:
    image: ${IMAGE:?IMAGE must be set — the deploy workflow renders it}
    container_name: food-st44-backup
    restart: unless-stopped
    # Not the app's entrypoint: no migrate, no import, no secret key.
    entrypoint: ["python", "manage.py", "backup", "/backups", "--nightly"]
    # Python as PID 1 ignores SIGTERM; SIGINT stops it at once instead of after the 10 s kill.
    stop_signal: SIGINT
    environment:
      DJANGO_DB_PATH: /data/food.sqlite3
    volumes:
      # Read-only: the backup can never change the live data.
      - food-st44-v2-data:/data:ro
      # deploy.sh only allows bind mounts under /srv/apps/food-st44. The variable is for the
      # CI smoke test; on the server it is unset.
      - ${FOOD_BACKUP_DIR:-/srv/apps/food-st44/backups}:/backups

# Both keyed to this project, so they survive `--force-recreate` redeploys.
volumes:
  # v2's database. New with the switch to v2.
  food-st44-v2-data:
  # v1's database (/data/recipes.db in the v1 image). Kept for rollback; v1
  # mounts it read-write at /data again if the switch is reverted.
  food-st44-data:

# Owned by the existing stack. `external: true` makes compose attach to it and
# fail loudly if it is missing, rather than creating a second, isolated network.
networks:
  st44_default:
    external: true
