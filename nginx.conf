server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health-check endpoint. Deploy is not finished until this answers 200.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
